name: Build macOS

on:
  workflow_dispatch:   # запуск вручную из GitHub UI

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Sync version
        run: python scripts/sync_version.py

      - name: Convert icon to .icns
        run: python scripts/convert_icon.py --icns assets/icon.icns

      - name: Build app
        run: |
          pyinstaller build.spec \
            --noconfirm \
            --distpath dist/macos \
            --workpath build/app_macos \
            --clean

      - name: Make executable
        run: chmod +x dist/macos/Pochtelye

      - name: Copy config.ini
        run: |
          [ -f config.ini ] && cp config.ini dist/macos/config.ini || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pochtelye-macos
          path: dist/macos/
          retention-days: 30
