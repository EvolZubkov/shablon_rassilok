<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Прототип drop-зоны</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, sans-serif;
    background: #0f172a;
    color: #f3f6fb;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .panel {
    background: #1a2540;
    border: 1px solid #334766;
    border-radius: 14px;
    padding: 24px;
    width: 480px;
    box-shadow: 0 24px 80px rgba(0,0,0,.4);
  }

  .panel-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #f3f6fb;
  }

  .field-group {
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 11px;
    color: #8ba3c7;
    margin-bottom: 5px;
    letter-spacing: .3px;
  }

  /* Обёртка поля + кнопка */
  .drop-wrap {
    position: relative;
    display: flex;
    align-items: stretch;
    gap: 6px;
  }

  /* Textarea / input */
  .exc-input {
    flex: 1;
    background: #0f1e38;
    border: 1.5px solid #2a3f5f;
    border-radius: 8px;
    color: #dbe8f8;
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    resize: vertical;
    min-height: 40px;
    transition: border-color .15s, box-shadow .15s;
    font-family: inherit;
  }

  .exc-input::placeholder { color: #3d5578; }
  .exc-input:focus { border-color: #4a7fd4; box-shadow: 0 0 0 3px rgba(74,127,212,.15); }

  /* Подсветка при drag-over */
  .exc-input.drag-over {
    border-color: #a78bfa;
    box-shadow: 0 0 0 3px rgba(167,139,250,.2);
    background: #1a1040;
  }

  /* Кнопка-иконка выбора файла */
  .pick-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    align-self: center;
    background: #1e3255;
    border: 1.5px solid #2a3f5f;
    border-radius: 8px;
    color: #8ba3c7;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, border-color .15s, color .15s, transform .1s;
  }

  .pick-btn:hover {
    background: #2a4a7f;
    border-color: #4a7fd4;
    color: #a8c6f0;
  }

  .pick-btn:active { transform: scale(.92); }

  /* Подсвечиваем кнопку когда файл тащим над полем */
  .drop-wrap.drag-active .pick-btn {
    border-color: #a78bfa;
    color: #c4b5fd;
    background: #2a1a5f;
  }

  /* Highlight-оверлей поверх поля при drag */
  .drop-wrap .drag-hint {
    display: none;
    position: absolute;
    inset: 0;
    right: 42px;           /* не перекрывать кнопку */
    border-radius: 8px;
    background: rgba(167,139,250,.07);
    border: 1.5px dashed #a78bfa;
    pointer-events: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #c4b5fd;
    font-size: 12px;
  }

  .drop-wrap.drag-active .drag-hint { display: flex; }

  /* Скрытый input[file] */
  .file-input { display: none; }

  /* Превью вставленного */
  .result {
    margin-top: 20px;
    background: #0d1a30;
    border: 1px solid #1e3255;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 12px;
    color: #8ba3c7;
    min-height: 48px;
    white-space: pre-wrap;
  }
  .result em { color: #4a7fd4; font-style: normal; }
</style>
</head>
<body>
<div class="panel">
  <div class="panel-title">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><polyline points="9 11 12 14 15 11"/><line x1="12" y1="14" x2="12" y2="8"/></svg>
    Прототип: поля с drop + кнопка выбора файла
  </div>

  <!-- Кому -->
  <div class="field-group">
    <label>Кому</label>
    <div class="drop-wrap" id="wrap-to">
      <textarea class="exc-input" id="field-to" rows="2"
                placeholder="a@rt.ru, b@rt.ru — или перетащите .xlsx / .ods"></textarea>
      <div class="drag-hint">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Отпустите файл
      </div>
      <button class="pick-btn" title="Выбрать файл" onclick="pickFile('field-to','file-to')">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <input type="file" class="file-input" id="file-to" accept=".xlsx,.ods,.xls,.csv">
    </div>
  </div>

  <!-- Копия -->
  <div class="field-group">
    <label>Копия</label>
    <div class="drop-wrap" id="wrap-cc">
      <input class="exc-input" id="field-cc" type="text"
             placeholder="cc@rt.ru — или перетащите .xlsx / .ods">
      <div class="drag-hint">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Отпустите файл
      </div>
      <button class="pick-btn" title="Выбрать файл" onclick="pickFile('field-cc','file-cc')">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <input type="file" class="file-input" id="file-cc" accept=".xlsx,.ods,.xls,.csv">
    </div>
  </div>

  <!-- Скрытая копия -->
  <div class="field-group">
    <label>Скрытая копия <span style="color:#4a5f7a;font-size:10px">(адреса скрыты от получателей)</span></label>
    <div class="drop-wrap" id="wrap-bcc">
      <input class="exc-input" id="field-bcc" type="text"
             placeholder="bcc@rt.ru — или перетащите .xlsx / .ods">
      <div class="drag-hint">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Отпустите файл
      </div>
      <button class="pick-btn" title="Выбрать файл" onclick="pickFile('field-bcc','file-bcc')">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <input type="file" class="file-input" id="file-bcc" accept=".xlsx,.ods,.xls,.csv">
    </div>
  </div>

  <div class="result" id="result">
    Перетащи .xlsx на поле или нажми кнопку ↑ — здесь появится результат.
  </div>
</div>

<script>
  // ── Кнопка выбора файла ──────────────────────────────────────────────────
  function pickFile(fieldId, inputId) {
    const inp = document.getElementById(inputId);
    inp.onchange = () => {
      if (inp.files[0]) handleFile(inp.files[0], fieldId);
      inp.value = '';
    };
    inp.click();
  }

  // ── Drag & Drop ──────────────────────────────────────────────────────────
  document.querySelectorAll('.drop-wrap').forEach(wrap => {
    const field = wrap.querySelector('.exc-input');

    let dragCounter = 0; // счётчик чтобы не мигало при проходе над дочерними элементами

    wrap.addEventListener('dragenter', e => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      dragCounter++;
      wrap.classList.add('drag-active');
      field.classList.add('drag-over');
    });

    wrap.addEventListener('dragover', e => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });

    wrap.addEventListener('dragleave', e => {
      if (!hasFiles(e)) return;
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        wrap.classList.remove('drag-active');
        field.classList.remove('drag-over');
      }
    });

    wrap.addEventListener('drop', e => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      dragCounter = 0;
      wrap.classList.remove('drag-active');
      field.classList.remove('drag-over');

      const file = e.dataTransfer.files[0];
      if (file) handleFile(file, field.id);
    });
  });

  function hasFiles(e) {
    return e.dataTransfer && e.dataTransfer.types &&
           (e.dataTransfer.types.includes('Files') || e.dataTransfer.types.includes('application/x-moz-file'));
  }

  // ── Обработка файла (заглушка вместо реального parse) ───────────────────
  function handleFile(file, fieldId) {
    const log = document.getElementById('result');
    log.innerHTML = `<em>Файл:</em> ${file.name} (${(file.size/1024).toFixed(1)} КБ)\n` +
                    `<em>Поле:</em> ${fieldId}\n\n` +
                    `В реальном приложении здесь открылся бы picker выбора столбца.`;

    // Имитируем вставку адресов
    const field = document.getElementById(fieldId);
    field.value = 'user1@example.com, user2@example.com, user3@example.com';
  }
</script>
</body>
</html>
